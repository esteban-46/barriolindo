<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente del Barrio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- Encabezado del chat -->
    <header>
      <div class="av">AB</div>
      <div>
        <b>Asistente del Barrio</b>
        <small>TianguisVecino · cuenta de empresa · maqueta ilustrativa</small>
      </div>
    </header>

    <!-- Aquí script.js agrega los mensajes y botones -->
    <main id="chat"></main>

    <!-- Barra para escribir -->
    <form id="form">
      <input id="in" placeholder="Escribe un mensaje" autocomplete="off" aria-label="Mensaje">
      <button type="submit" aria-label="Enviar">➤</button>
    </form>

  </div>

  <script src="app/script.js"></script>
</body>
</html>
